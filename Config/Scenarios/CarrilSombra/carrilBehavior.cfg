// Parámetros del comportamiento de la carrera (CarrilBehavior).
// Arranque: un silbato nuevo o un toque al botón frontal de la cabeza (el pecho nunca arranca).
arranquePorSilbato = true; // true: el silbato del juez también arranca (además del botón). Probar aparte.
margenSilbato = 500; // ms: un silbato solo cuenta si es posterior al armado + este margen
minConfianzaSilbato = 0.35; // confianza mínima del silbato (robot real: silbato a 0.42-0.49) (el WhistleRecognizer ya filtra en 0.25)
esperaTrasBoton = 800; // ms en pie tras el toque a la cabeza, para retirar la mano
esperaTrasSilbato = 0; // ms en pie tras el silbato antes de andar
velocidadAvance = 0.8; // sim: 0.5 -> 36 s, 0.8 -> 24 s, 1.0 -> 21.5 s, todas sin salidas; 0.8 hasta probar en robot real
kD = 0.003;        // giro por mm de desplazamiento lateral (100 mm -> 0.3)
kPsi = 1.5;        // giro por radián de desorientación (25 grados -> 0.65)
maxGiro = 0.6;
frenoPorGiro = 0.5;
maxEdadPercepto = 300;
maxEdadSinPercepto = 2000;
avanceSinPercepto = 0.3;
inclinacionCabeza = 30deg; // ángulo de la cámara INFERIOR bajo la horizontal (HeadMotionEngine resta los 39.7° cuello-cámara): con 30 ve el suelo desde ~0.3 m hasta varios metros
distanciaFrenado = 1300; // robot real: desde ~1.2 m la franja tapa las líneas
avanceFrenado = 0.4;
distanciaFijarParada = 1200; // robot real: fijarla antes de perder las líneas (se refina mientras se ve la meta)
margenParada = 200;
// Paro por inclinación: torso más inclinado que esto (o caída) aborta la carrera.
maxInclinacion = 25deg;
levantarseTrasCaida = false; // con arnés: quedarse sin rigidez en el suelo
// Recuperación tras caída: solo con levantarseTrasCaida = true (el robot tiene que levantarse solo).
reanudarTrasCaida = false; // true: tras levantarse y estar estable, seguir la carrera sin reiniciarla
maxCaidas = 2; // caídas que se reanudan; tras la siguiente (la 3.ª) queda sin rigidez en el suelo
tiempoEstableTrasCaida = 1000; // ms de pie y estable antes de reanudar
inclinacionEstable = 10deg; // inclinación del torso que se considera estable (debe ser < maxInclinacion)
