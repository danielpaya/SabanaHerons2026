// Parámetros del comportamiento de la carrera (CarrilBehavior).
esperaInicial = 2000; // desde que empieza playing (toque al pecho o GameController) hasta echar a andar
velocidadAvance = 0.8; // sim: 0.5 -> 36 s, 0.8 -> 24 s, 1.0 -> 21.5 s, todas sin salidas; 0.8 hasta probar en robot real
kD = 0.003;        // giro por mm de desplazamiento lateral (100 mm -> 0.3)
kPsi = 1.5;        // giro por radián de desorientación (25 grados -> 0.65)
maxGiro = 0.6;
frenoPorGiro = 0.5;
maxEdadPercepto = 300;
maxEdadSinPercepto = 2000;
avanceSinPercepto = 0.3;
inclinacionCabeza = 30deg; // ángulo de la cámara INFERIOR bajo la horizontal (HeadMotionEngine resta los 39.7° cuello-cámara): con 30 ve el suelo desde ~0.3 m hasta varios metros
distanciaFrenado = 800;
avanceFrenado = 0.3;
distanciaFijarParada = 500;
margenParada = 200;
// Paro por inclinación: torso más inclinado que esto (o caída) aborta la carrera.
maxInclinacion = 25deg;
levantarseTrasCaida = false; // con arnés: quedarse sin rigidez en el suelo
