// Parametros de la marcha RL (NaoRLWalkEngine), solo escenario CarrilRL. Contrato: demo_carril/docs/despliegue_nao_v08.md.
// Los umbrales de seguridad son CONSERVADORES a proposito y estan SIN MEDIR en el robot: fijarlos en E2 (suspendido)
// con el registro (naoRL_<n>.csv) y anotarlos en la bitacora. Un paro de mas es barato; un motor roto no.

// SEGURO: con false la politica nunca mueve el robot (en CarrilRL el robot se queda de pie con B-Human).
usarPoliticaRL = false;
politica = "nao_v08";

// Mando a la politica: cmd = (vxCmd, 0). Entrenada hasta 0.5; E3: 0.2, E4: 0.3/0.4, E5: 0.5.
vxCmd = 0.5;
frecuenciaMarcha = 1.8;   // Hz (entrenamiento: [1.6, 2.0] al azar por episodio)

interpolacionMs = 1500;   // postura actual -> home
asentarMs = 500;

// Rigidez [%]: variable de prueba (6b.6). Medir seguimiento y corriente con 100, 80 y 60 en E2/E3.
stiffnessPiernas = 100;
stiffnessBrazos = 100;
stiffnessParo = 0;        // tras un paro duro: soltar (6b.4)

// Por motor, orden de la accion (LHipYawPitch, LHipRoll, LHipPitch, LKneePitch, LAnklePitch, LAnkleRoll, RHipRoll,
// RHipPitch, RKneePitch, RAnklePitch, RAnkleRoll, LShoulderPitch, RShoulderPitch, LElbowRoll, RElbowRoll).
// Copiados de nao_v08_golden.json (lo, hi, vel_max); la prueba E0 comprueba que coinciden.
lo = [-1.14529002, -0.379435003, -1.53588998, -0.0923279002, -1.18944001, -0.397760987, -0.790459991, -1.53588998, -0.102973998, -1.18630004, -0.768992007, -2.08566999, -2.08566999, -1.54462004, 0.0349065997];
hi = [0.740718007, 0.790459991, 0.48398, 2.11255002, 0.922581017, 0.768992007, 0.379435003, 0.48398, 2.12004995, 0.932006001, 0.397935003, 2.08566999, 2.08566999, -0.0349065997, 1.54462004];
velMax = [4.53000021, 4.53000021, 6.96000004, 6.96000004, 6.96000004, 4.53000021, 4.53000021, 6.96000004, 6.96000004, 6.96000004, 4.53000021, 7.46000004, 7.46000004, 6.46999979, 6.46999979];
factorVelRoll = 0.8;      // 6b.5: las 4 de roll a 80 % mientras no se mida su respuesta real
margenLimites = 0.05;     // rad hacia dentro de jointLimits.cfg

// Paros DUROS (enclavados hasta volver a armar con el pecho; rigidez -> stiffnessParo de inmediato).
// Rangos permitidos (H4, propuestas sin medir): tabla rangosSeguridad en Src/Tools/NaoRL/NaoRLGuardas.h. Fuera de rango no arma.
maxInclinacion = 0.40;    // rad (~23 grados): antes que el paro de CarrilBehavior (25 grados) para soltar primero
maxTemperatura = 65;      // C, cualquier motor de pierna (antes de cada prueba deben estar < 50)
umbralCorriente = 1000;   // mA, cualquier motor de pierna... SIN MEDIR: medir el nivel normal en E2 y poner holgura
ciclosCorriente = 20;     // ...sostenida 20 ciclos (240 ms)
umbralSeguimiento = 0.15; // rad, |objetivo - medido| en piernas (6b.2, propuesta del contrato)
umbralSeguimientoRoll = 0.12; // rad, mas estricto en LHipRoll, RHipRoll, LAnkleRoll, RAnkleRoll
ciclosSeguimiento = 5;    // ciclos de 12 ms seguidos
retardoSeguimiento = 3;   // se compara con el objetivo de hace 3 ciclos (~36 ms de retraso del servo)
maxFallosNaN = 3;
presupuestoInferenciaUs = 5000; // watchdog: una decision dispone de 24 ms; el hilo Motion de 12 ms
maxExcesosInferencia = 3;

// Paros SUAVES (stand de B-Human).
maxEdadCamaraMs = 500;           // sin carril valido durante la marcha (v08 no se entreno con apagones)
distanciaMetaSinCamara = 1300;   // mm: con la meta vista mas cerca que esto, perder las lineas no es paro. Robot real
                                 // (BITACORA_ROBOT_REAL): desde ~1.2 m la franja tapa las lineas; = distanciaFrenado de carrilBehavior.cfg
maxMarchaMs = 30000;             // respaldo de la parada en meta (5 m a 0.2 m/s = 25 s)

// Autoverificacion en home antes de caminar (H7). El resto de sus umbrales esta en NaoRLGuardas.h.
maxCorrienteHome = 800;          // mA, media de |corriente| de las 12 de pierna en home. SIN MEDIR: fijarla con la linea base

// SOLO PARA PRUEBAS (dejar en false para el suelo):
ignorarCamara = false;    // E2/E3: vis = (0, 0) y sin paro por camara
ignorarLevantado = false; // E2: el robot colgado esta "pickedUp"; sin esto no camina en el aire

rutaRegistro = "/home/nao/logs";
exigirRegistro = true;    // en el robot real no camina sin registro (6b.7)
